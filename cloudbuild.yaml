# Test, then deploy backend and frontend on every push to the deploy branch (trigger: scripts/setup_cloud_build.sh).
# Runs as build-sa (roles in setup_cloud_build.sh). The PWA's Firebase keys come from Secret Manager.
steps:
  - id: secrets-scan
    name: zricethezav/gitleaks:v8.21.2
    args: ["detect", "--source=.", "--no-git", "--no-banner", "--redact"]

  - id: backend-tests
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg libraqm0 fonts-noto-core >/dev/null
        pip install -q uv==0.12.23
        cd backend && uv sync --frozen -q && uv run ruff check . ../eval && uv run pytest -q

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env: ["PROJECT_ID=$PROJECT_ID"]
    args: ["scripts/deploy_backend.sh"]

  - id: deploy-frontend
    name: node:20
    entrypoint: bash
    env: ["PROJECT_ID=$PROJECT_ID"]
    secretEnv: [VITE_FIREBASE_API_KEY, VITE_FIREBASE_APP_ID, VITE_FIREBASE_VAPID_KEY, VITE_RECAPTCHA_ENTERPRISE_SITE_KEY]
    args:
      - -c
      - |
        set -e
        corepack enable && corepack prepare pnpm@12.9.1 --activate
        npm i -g -s firebase-tools@15.32.1
        ./scripts/deploy_frontend.sh

availableSecrets:
  secretManager:
    - {versionName: projects/$PROJECT_ID/secrets/vite-firebase-api-key/versions/latest, env: VITE_FIREBASE_API_KEY}
    - {versionName: projects/$PROJECT_ID/secrets/vite-firebase-app-id/versions/latest, env: VITE_FIREBASE_APP_ID}
    - {versionName: projects/$PROJECT_ID/secrets/vite-firebase-vapid-key/versions/latest, env: VITE_FIREBASE_VAPID_KEY}
    - {versionName: projects/$PROJECT_ID/secrets/vite-recaptcha-site-key/versions/latest,
       env: VITE_RECAPTCHA_ENTERPRISE_SITE_KEY}
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
