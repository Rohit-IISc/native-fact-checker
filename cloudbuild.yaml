# Copy to repo root. Trigger: push to main (connect GitHub in the Cloud Build console once).
# Build service account needs: Cloud Run Admin, Service Account User (on api-sa), Firebase Hosting Admin,
# Artifact Registry Writer, Secret Manager Secret Accessor.
steps:
  - id: secrets-scan
    name: zricethezav/gitleaks:latest
    args: ["detect", "--source=.", "--no-banner"]
  - id: backend-tests
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install uv && cd backend && uv sync && uv run ruff check . && uv run pytest -q"]
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env: ["PROJECT_ID=$PROJECT_ID"]
    args: ["scripts/deploy_backend.sh"]
  - id: deploy-frontend
    name: node:20
    entrypoint: bash
    env: ["PROJECT_ID=$PROJECT_ID"]
    args: ["-c", "corepack enable && npm i -g firebase-tools && ./scripts/deploy_frontend.sh"]
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
