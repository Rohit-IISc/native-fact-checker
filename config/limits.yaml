quota:
  checks_per_user_per_day: 10
  judge_checks_per_day: 50
  judge_allowlist: []            # add judge emails before Oct 17
  day_boundary_tz: Asia/Kolkata
  count_cache_hits: true
global_daily_new_checks: 1500    # circuit breaker on full investigations
input:
  max_share_bytes: 52428800      # 50 MB
  max_images: 10
  max_media_seconds: 180
  max_text_chars: 10000
  max_claims_per_check: 3
  low_media_resolution_over_seconds: 60
timeouts_s:
  tier1: 5
  link_fetch: 10
  extraction_base: 30            # flash_think (512 thinking tokens): images 10-13 s, hedged at 16 s
  extraction_per_media_second: 0.2
  tier2: 8                      # embedding (hedged at 2 s) and each near-match call
  sub_agent: 36                 # web search: grounded search 8-9 s or 30+ s (hedged at 12 s) + classify 6 s
  packager: 15                  # measured Oct 5: 6 s
  judge: 30                     # gemini-2.5-pro: 9-25 s by pack size (hedged at 14 s)
  critic: 20
  judge_revision: 20
  composer: 20                  # measured 7-18 s (hedged at 9 s)
  tts: 40                       # Gemini TTS measured 18-24 s per 60-80 word answer (Oct 7); runs after DONE
  card: 12
  total_base: 90
  background_retry_total: 120
web_search:
  max_grounded_queries: 4
cache:
  phash_max_hamming: 6
  video_keyframe_every_s: 5
  video_keyframe_match_ratio: 0.6
  tier2_strong_distance: 0.10
  tier2_weak_distance: 0.18
  live_event_active_days: 90
  not_enough_evidence_ttl_days: 3
evidence:
  max_items_per_claim: 12
media_retention_hours: 24
