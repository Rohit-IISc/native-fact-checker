# Fixed user-facing answer text, per content language (decision 15: answers are in the language of
# the forwarded content, not the UI language). Keys are i18n base codes from languages.yaml.
# English is the fallback for any other language.
#
# non_checkable: shown when the extractor finds nothing to fact-check (by non_checkable_type).
# stub: Day 1 stand-in answer until the composer lands (Day 5). Always NOT_ENOUGH_EVIDENCE.
en:
  non_checkable:
    OPINION: This post is an opinion. There is no fact to check.
    SATIRE: This post is satire. It is not meant to be read as news.
    JOKE: This post is a joke. There is no fact to check.
    GREETING: This is a greeting message. There is nothing to fact-check.
    PROMOTION: This post is an advertisement or promotion. There is no factual claim to check.
    DEVOTIONAL: This is a devotional message. There is nothing to fact-check.
    PERSONAL_MESSAGE: This is a personal message. There is nothing to fact-check.
    OTHER: We did not find a factual claim to check in this post.
  stub:
    headline: "Not confirmed yet: we could not check this claim"
    summary: We could not confirm this claim either way. Please do not forward it until it is confirmed.
    what_is_true: We have not searched for evidence on this claim yet.
    post_claims: "The post claims:"
    could_not_confirm: We could not confirm this either way yet.
    do_not_forward: Please do not forward it until it is confirmed by a trusted source.
    card_title: Not confirmed
    card_footer: Do not forward until confirmed
    confidence:
      HIGH: We are very sure.
      MEDIUM: We are fairly sure.
      LOW: We are not sure.
