# Model registry. Python reads models by key, never by name.
# IDs as of Oct 9, 2026 (decision 47). Run scripts/check_models.py before a deploy is called done;
# it checks each primary and its fallback. Prices are USD per 1M tokens.
vertex:
  location: global          # Gemini endpoint
models:
  flash:
    # Oct 9 switch (decision 47): 3.8 Flash + 3.1 Pro preview gave 19/20 in make accept at 44 s average vs
    # 13/20 at 59 s for 2.5 in the control run right after, with 1 timeout vs 10 for 2.5 Flash. On Oct 5
    # the same 3.x models were slow and erratic (3.8 Flash 13.6-22.8 s on the extractor), so watch
    # v_rate_limits and the eval trend; 2.5 stays as the fallback.
    id: gemini-3.8-flash
    thinking: low           # Gemini 3 takes a thinking level; 2.5 models take thinking_budget (tokens)
    # After retries, a final 429 or 5xx tries this once (llm._with_fallback). Separate Vertex capacity.
    fallback: {id: gemini-2.5-flash, thinking_budget: 0}
    price_in: 0.75          # introductory rate until Dec 31, 2026; 1.50 / 7.50 from Jan 1, 2027
    price_out: 3.75
    hedge_after_s: 9        # tail stalls happen on every model; llm._hedged duplicates a slow call
    search_hedge_after_s: 12  # grounded search: 8-9 s or 35-55 s for the same request (Oct 5)
  flash_think:
    # The extractor needs a little reasoning: with thinking off it took a sarcastic caption ("Gujarat model of
    # development in Mumbai") as the claim instead of what the photo shows (4/4 runs on Oct 7, 2.5 Flash);
    # with a 512-token budget it made the media claim (5/5). Gemini 3: thinking medium.
    id: gemini-3.8-flash
    thinking: medium
    fallback: {id: gemini-2.5-flash, thinking_budget: 512}
    price_in: 0.75
    price_out: 3.75
    hedge_after_s: 16
  pro:
    # Oct 9: 3.1 Pro preview judged in 4.8 s p50 (10.6 s p90) vs 10.7 s for 2.5 Pro, using about a third of
    # the output and thinking tokens. It is a preview model: 2.5 Pro is the fallback. (Oct 5 it took 35-51 s.)
    id: gemini-3.1-pro-preview
    thinking: medium
    fallback: {id: gemini-2.5-pro, thinking_budget: 1024}
    price_in: 2.00            # <= 200k input tokens
    price_out: 12.00
    # Priority PayGo prices are not set: Google lists no figures, and on Oct 9 this project was served
    # ON_DEMAND even with the priority header. model_cost uses the standard rates if priority is ever served.
    hedge_after_s: 14
  embedding:
    id: gemini-embedding-001
    dims: 768
    price_in: 0.15
    hedge_after_s: 2        # usually 0.6-1.7 s; one call stalled past 6 s on Oct 5 (cheap to duplicate)
  tts:
    id: gemini-2.5-flash-tts
    fallbacks: [gemini-2.5-pro-tts]
    location: global
    est_cost_per_answer: 0.01
# Vertex Priority PayGo for the panel: steadier service on shared capacity, billed at the priority rates
# above, no commitment. Off by default; Rohit decides whether to turn it on from Oct 17 to the end of
# judging (estimate made for 2.5 Pro: about 0.026 USD more per check, 39 USD per 1,500 checks). Requests above spare
# priority capacity are served as standard; model_calls.priority records what was actually served.
priority:
  enabled: false
  stages: [judge, critic, judge_revision]

grounding:
  free_queries_per_month: 5000
  price_per_1000: 14.00
vision:
  web_detection_price_per_1000: 3.50
stage_models:
  extractor: flash_think
  near_match: flash
  web_search: flash
  web_search_classify: flash
  factcheck_sites: flash
  source_credibility: flash
  media_provenance: flash
  packager: flash
  judge: pro
  critic: pro
  judge_revision: pro
  composer: flash
  same_media: flash              # second look at background items for claims about the post's own media
  translator: flash
  panel_timeout_fallback: flash
  eval_query: flash            # eval runner only: restate a benchmark claim in another language
  eval_claim_form: flash       # eval dataset build only: drop fact-checker conclusions posing as claims
