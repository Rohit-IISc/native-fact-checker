# Assigned by code, never by a model. See docs/09-source-credibility.md.
# Matching: exact domain or any subdomain of it. Entries with a path (site.com/fact-check) match that
# URL prefix; a path ending in * matches any path starting with it (site.com/en/fact-check*). Suffix
# rules match the end of the host. The most specific matching entry wins.
#
# IFCN check: Rohit checked https://ifcncodeofprinciples.poynter.org/signatories on 2026-10-07.
# Rule: IFCN "Active" and "In Renewal" signatories are TIER_1; not listed or expired is not automatically
# tier 1. For outlets that are also general news sites, only the fact-check section is TIER_1 and the
# rest of the site is TIER_2. Domains and section paths verified on 2026-10-07 against the outlets' own
# sites and their ClaimReview URLs. Re-check before submission.
tier_1:
  suffixes: [.gov.in, .nic.in, .gov, .go.id, .gov.uk, .int]
  domains:
    # Official India
    - pib.gov.in
    - rbi.org.in
    - eci.gov.in
    - mohfw.gov.in
    - imd.gov.in
    - ndma.gov.in
    - cybercrime.gov.in
    - mygov.in
    # Official Indonesia
    - komdigi.go.id
    - bmkg.go.id
    - bnpb.go.id
    # International bodies
    - who.int
    - un.org
    # Wires (IFCN: AFP Fact Check, AP Fact Check, Reuters, PTI). Whole sites, incl. regional editions.
    - reuters.com
    - apnews.com
    - ap.org
    - afp.com              # factcheck.afp.com and its language editions (periksafakta., factcheckhindi.)
    - ptinews.com          # incl. bhasha.ptinews.com
    # India, IFCN active
    - boomlive.in          # incl. hindi. and bangla.
    - newschecker.in
    - factly.in            # incl. language subdomains
    - factcrescendo.com    # incl. language and country subdomains
    - indiatoday.in/fact-check           # also malayalam.indiatoday.in/fact-check
    - thequint.com/news/webqoof
    - thequint.com/hindi/webqoof
    - vishvasnews.com
    - youturn.in
    - digiteye.in          # incl. kannada. and telugu.
    - newsmeter.in
    - newsmobile.in/nm-fact-checker
    - firstcheck.in
    - manoramaonline.com/fact-check
    - medicaldialogues.in/fact-check
    - thip.media
    - thelallantop.com/factcheck
    - telugupost.com/factcheck
    - telugupost.com/kannada-factcheck
    - telugupost.com/english-factcheck
    # India, IFCN in renewal
    - lighthousejournalism.com
    # Indonesia
    - turnbackhoax.id      # MAFINDO
    - liputan6.com/cek-fakta
    - kompas.com/cekfakta
    - cekfakta.kompas.com
    - tirto.id/keliru-*    # Tirto fact checks have no section folder; their slugs start with the rating
    - tirto.id/salah-*
    - tirto.id/menyesatkan-*
    - tirto.id/hoaks-*
    - tirto.id/benar-*
    - tirto.id/sebagian-*
    - tirto.id/news/periksa-fakta
    - cekfakta.tempo.co    # Tempo, in renewal
    - tempo.co/cekfakta
    # Region
    - rappler.com/newsbreak/fact-check
    - annielab.org
    - fact-watch.org       # FactWatch Bangladesh, in renewal (factwatchbd.com does not resolve; fact-watch.org is its site)
    - nepalfactcheck.org   # in renewal
    - sochfactcheck.com    # Pakistan
    # Also on the IFCN list
    - leadstories.com
    - politifact.com
    - factcheck.org
    - snopes.com
    - fullfact.org
    - dw.com/en/fact-check*
tier_2:
